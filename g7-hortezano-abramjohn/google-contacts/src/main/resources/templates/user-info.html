<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile - Contact Manager</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Include common styles -->
    <div th:replace="common-styles"></div>
</head>
<body>
<!-- Animated background pattern -->
<div class="bg-pattern"></div>

<nav class="navbar navbar-expand-lg navbar-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="/contacts">
            <i class="bi bi-person-lines-fill me-2"></i>Contact Manager
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/contacts">
                        <i class="bi bi-journal-text me-1"></i>Contacts
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="/user-info">
                        <i class="bi bi-person-circle me-1"></i>Profile
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/logout">
                        <i class="bi bi-box-arrow-right me-1"></i>Logout
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container profile-container fade-in">
    <div class="card">
        <div class="card-header text-center">
            <h3 class="mb-0"><i class="bi bi-person-badge-fill me-2"></i>User Profile</h3>
        </div>
        <div class="card-body text-center slide-up">
            <div class="user-info">
                <img th:if="${pictureUrl}" th:src="${pictureUrl}" class="profile-image" alt="Profile picture">
                <img th:unless="${pictureUrl}" src="/placeholder.svg?height=120&width=120" class="profile-image" alt="Default profile">

                <div class="user-details mb-4">
                    <h3 class="fw-bold mb-3">Welcome, <span th:text="${name}">User</span>!</h3>
                    <div class="d-flex align-items-center justify-content-center mb-2">
                        <i class="bi bi-envelope-fill me-2 text-primary"></i>
                        <span th:text="${email}" class="fs-5">email@example.com</span>
                    </div>
                    <div class="badge bg-primary p-2 mt-2">
                        <i class="bi bi-google me-1"></i> Google Account Connected
                    </div>
                </div>

                <div class="card mb-4 border-0 bg-light">
                    <div class="card-body">
                        <h5 class="card-title"><i class="bi bi-info-circle-fill me-2 text-primary"></i>Account Information</h5>
                        <p class="card-text">Your account is connected to Google Contacts, allowing you to manage your contacts directly from this application.</p>
                    </div>
                </div>

                <div class="d-grid gap-3">
                    <a href="/contacts" class="btn btn-primary">
                        <i class="bi bi-journal-text me-2"></i>View My Contacts
                    </a>
                    <a href="/logout" class="btn btn-outline-primary">
                        <i class="bi bi-box-arrow-right me-2"></i>Logout
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
