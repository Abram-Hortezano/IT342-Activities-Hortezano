<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Contact Manager - Google Contacts Integration</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        .contact-card {
            transition: transform 0.2s, box-shadow 0.2s;
            min-height: 200px;
        }
        .contact-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
        }
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .action-btn {
            width: 100%;
            margin: 4px 0;
        }
    </style>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark gradient-bg mb-4">
    <div class="container">
        <a class="navbar-brand" href="#">
            <i class="bi bi-person-lines-fill me-2"></i>Contact Manager
        </a>
        <div class="d-flex">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="/user-info">
                        <i class="bi bi-person-circle me-1"></i>Profile
                    </a>
                </li>
                <li class="nav-item ms-3">
                    <a class="nav-link" href="/logout">
                        <i class="bi bi-box-arrow-right me-1"></i>Logout
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-dark mb-0">Your Contacts</h2>
        <a href="/contact/add-form" class="btn btn-primary btn-lg rounded-pill shadow">
            <i class="bi bi-plus-lg me-2"></i>Add Contact
        </a>
    </div>

    <div class="alert alert-warning text-center" th:if="${contacts == null || contacts.isEmpty()}">
        <i class="bi bi-exclamation-triangle me-2"></i>No contacts found. Start by adding a new contact.
    </div>

    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4" th:unless="${contacts == null || contacts.isEmpty()}">
        <div class="col" th:each="contact : ${contacts}">
            <div class="card contact-card h-100 shadow-sm">
                <div class="card-header bg-white">
                    <h5 class="card-title mb-0 text-primary">
                        <i class="bi bi-person-badge me-2"></i>
                        <span th:text="${not #lists.isEmpty(contact.names) ? contact.names[0].displayName : 'Unnamed Contact'}"></span>
                    </h5>
                </div>
                <div class="card-body">
                    <div class="mb-3">
                        <h6 class="text-muted"><i class="bi bi-envelope me-2"></i>Email</h6>
                        <p class="card-text" th:text="${not #lists.isEmpty(contact.emailAddresses) ? contact.emailAddresses[0].value : 'No email'}"></p>
                    </div>
                    <div class="mb-3">
                        <h6 class="text-muted"><i class="bi bi-phone me-2"></i>Phone</h6>
                        <p class="card-text" th:text="${not #lists.isEmpty(contact.phoneNumbers) ? contact.phoneNumbers[0].value : 'No phone number'}"></p>
                    </div>
                </div>
                <div class="card-footer bg-white border-top-0">
                    <div class="d-grid gap-2">
                        <a th:href="@{'/contacts/edit/people/' + ${contact.resourceName.split('/')[1]}}"
                           class="btn btn-outline-primary action-btn">
                            <i class="bi bi-pencil-square me-2"></i>Edit
                        </a>
                        <a th:href="@{'/contacts/delete/people/' + ${contact.resourceName.split('/')[1]}}"
                           class="btn btn-outline-danger action-btn"
                           onclick="return confirm('Are you sure you want to delete this contact?')">
                            <i class="bi bi-trash3 me-2"></i>Delete
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</body>
</html>
